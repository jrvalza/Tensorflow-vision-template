task: "classification"

model_name: "CNN-from-Scratch"

builder: "declarative_classification_model"
blocks:

  - type: conv2d
    params: {filters: 32, activation: relu, batch_norm: true}

  - type: conv2d
    params: {filters: 32, activation: relu, batch_norm: true, pooling: max2d, dropout_rate: 0.25}

  - type: conv2d
    params: {filters: 64, activation: relu, batch_norm: true}

  - type: conv2d
    params: {filters: 64, activation: relu, batch_norm: true, pooling: max2d, dropout_rate: 0.25}

  - type: dense_head
    params: {units: [512], output_activation: softmax, batch_norm: true, dropout_rate: 0.5}
