dataset_name: "PNOA-ortoimagenes"

num_bands: 3

train_dir: "raw_data/classification/binary/Train"
test_dir: "raw_data/classification/binary/Test"

loader: 
  name: "image_dataset_from_directory"
  params:
    batch_size: 8
    image_size: [64, 64]
    validation_split: 0.2
    label_mode: "int"
    seed: 1
    shuffle: True
    
preprocessing:
  steps:
    - name: "pixel-value-normalization"
      params:
        value: 255.0

augmentation:
  enabled: true
  transforms:
    - name: "random-flip"
      params:
        mode: "horizontal_and_vertical"
    
    - name: "random-rotation"
      params:
        factor: 0.25

    - name: "random-zoom"
      params:
        height_factor: 0.05
        width_factor: 0.05
    
    - name: "random-translation"
      params:
        height_factor: 0.05
        width_factor: 0.05
